name: cuadra-supabase

# Supabase self-hosted mínimo para desarrollo local (sin Supabase CLI).
# Uso: copiá .env.example a .env y corré `docker compose up -d`.
# La app apunta a http://localhost:${KONG_PORT} (gateway Kong).
#
# ⚠️ Solo para desarrollo: las claves de .env.example son las claves demo
# públicas de la documentación de Supabase. Nunca usar en producción.

services:
  db:
    image: supabase/postgres:15.1.0.117
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-55622}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db_data:/var/lib/postgresql/data
      # Montajes archivo por archivo: la imagen trae sus propios scripts en
      # init-scripts/ y migrations/, y montar el directorio entero los pisa.
      - ./init/00-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./init/05-realtime-schema.sql:/docker-entrypoint-initdb.d/migrations/99-05-realtime.sql:ro
      - ./init/10-extensiones.sql:/docker-entrypoint-initdb.d/migrations/99-10-extensiones.sql:ro
      - ./init/20-geografia.sql:/docker-entrypoint-initdb.d/migrations/99-20-geografia.sql:ro
      - ./init/30-catalogo.sql:/docker-entrypoint-initdb.d/migrations/99-30-catalogo.sql:ro
      - ./init/40-casos.sql:/docker-entrypoint-initdb.d/migrations/99-40-casos.sql:ro
      - ./init/50-usuarios.sql:/docker-entrypoint-initdb.d/migrations/99-50-usuarios.sql:ro
      - ./init/60-siembra.sql:/docker-entrypoint-initdb.d/migrations/99-60-siembra.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      # El primer initdb corre todas las migraciones de la imagen y tarda.
      start_period: 180s

  auth:
    image: supabase/gotrue:v2.99.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:${KONG_PORT:-55621}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Sin SMTP en dev: los mails se autoconfirman.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    image: supabase/storage-api:v0.40.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage_data:/var/lib/storage

  realtime:
    # El hostname tiene que coincidir con el tenant dev que resuelve Kong.
    container_name: realtime-dev.cuadra-realtime
    image: supabase/realtime:v2.10.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    command: >
      sh -c "/app/bin/migrate
      && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)'
      && /app/bin/server"

  meta:
    image: supabase/postgres-meta:v0.68.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:20230921-d657f29
    restart: unless-stopped
    depends_on:
      - meta
    ports:
      - "${STUDIO_PORT:-55623}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:${KONG_PORT:-55621}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DEFAULT_ORGANIZATION_NAME: Cuadra
      DEFAULT_PROJECT_NAME: cuadra-local

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - "${KONG_PORT:-55621}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro

volumes:
  db_data:
  storage_data:
